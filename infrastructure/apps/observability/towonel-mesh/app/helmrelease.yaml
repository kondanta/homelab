---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: towonel-mesh
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.3.0
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
---
# Scrapes the off-cluster host that runs the towonel mesh agent (exporters on its loopback)
# through towonel's private mesh: no inbound port on the host, no public write endpoint here.
# `mesh up` keeps this pod enrolled; each `mesh connect` opens a local port that forwards to
# a port on the peer tagged `tag:hetzner`. The Service below exposes those local ports to
# vmagent (see vmstatic-scrapes/hetzner.yaml).
#
# Prerequisites (towonel hub, not in git): the dedicated monitoring tenant, a `tag:monitor`
# auth key in secret.sops.yaml, and the access policy that lets tag:monitor reach tag:hetzner.
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-mesh
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: towonel-mesh
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      towonel-mesh:
        # StatefulSet: the device identity lives on the volume. Auth keys are single-use, so
        # a pod that loses its state can no longer re-enroll (401 "already used").
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          volumeClaimTemplates:
            - name: state
              storageClass: longhorn
              accessMode: ReadWriteOnce
              size: 1Gi
              globalMounts:
                - path: /state
        containers:
          up:
            image: &image
              repository: codeberg.org/towonel/towonel-node
              tag: 1.13.3
            args: ["mesh", "up", "--name", "cluster-monitor"]
            env: &state
              TOWONEL_MESH_STATE_DIR: /state
            # TOWONEL_HUB_URL + TOWONEL_MESH_AUTH_KEY; the key is only used for the first enrollment
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                # the towonel binary carries the file capability cap_net_bind_service=ep; with
                # `drop: ALL` alone the exec fails ("tini: exec ... Operation not permitted")
                drop: ["ALL"]
                add: ["NET_BIND_SERVICE"]
            resources: &resources
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
          connect-node-exporter:
            image: *image
            args: ["mesh", "connect", "tag:hetzner:9100", "--local", "0.0.0.0:9100"]
            env: *state
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9100
                  initialDelaySeconds: 15
                  periodSeconds: 30
            securityContext: *securityContext
            resources: *resources
          connect-cadvisor:
            image: *image
            args: ["mesh", "connect", "tag:hetzner:8081", "--local", "0.0.0.0:8081"]
            env: *state
            probes:
              liveness:
                <<: *probe
                spec:
                  tcpSocket:
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 30
            securityContext: *securityContext
            resources: *resources
    service:
      app:
        controller: towonel-mesh
        ports:
          node-exporter:
            port: 9100
          cadvisor:
            port: 8081
