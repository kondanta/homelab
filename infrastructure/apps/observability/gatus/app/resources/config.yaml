---
alerting:
  discord:
    webhook-url: ${DISCORD_WEBHOOK}
    default-alert:
      description: "Health check failed"
      send-on-resolved: true
      failure-threshold: 2
      success-threshold: 2

connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

ui:
  title: Status | Gatus
  header: Status
  link: https://github.com/kondanta
  buttons:
    - name: GitHub
      link: https://github.com/kondanta
    - name: Homelab
      link: https://github.com/kondanta/homelab

endpoints:
  - name: koito
    group: external
    url: https://koito.taylan.dev/
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    alerts:
      - type: discord
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-hostname: true
      hide-url: true

  - name: multiscrobbler
    group: external
    url: https://scrobbler.taylan.dev/
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    headers:
      # gatus has no basic-auth config field; it does a raw, unescaped
      # os.ExpandEnv substitution on the whole file before YAML parsing, so
      # the value must be pre-encoded to only contain YAML-safe characters.
      # MULTISCROBBLER_BASIC_AUTH = base64("user:password").
      Authorization: "Basic ${MULTISCROBBLER_BASIC_AUTH}"
    alerts:
      - type: discord
    conditions:
      # authenticated request, so this actually checks the backend behind
      # Caddy, not just that Caddy's auth gate is up.
      - "[STATUS] == 200"
    ui:
      hide-hostname: true
      hide-url: true

metrics: true

storage:
  type: sqlite
  path: /config/sqlite.db
  caching: true

web:
  port: ${WEB_PORT}
