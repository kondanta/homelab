---
alerting:
  discord:
    webhook-url: ${DISCORD_WEBHOOK}
    default-alert:
      description: "Health check failed"
      send-on-resolved: true
      failure-threshold: 2
      success-threshold: 2

connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

ui:
  title: Status | Gatus
  header: Status
  link: https://github.com/kondanta
  buttons:
    - name: GitHub
      link: https://github.com/kondanta
    - name: Homelab
      link: https://github.com/kondanta/homelab

endpoints:
  - name: koito
    group: external
    url: https://koito.taylan.dev/
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    alerts:
      - type: discord
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-hostname: true
      hide-url: true

  - name: multiscrobbler
    group: external
    url: https://scrobbler.taylan.dev/
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    alerts:
      - type: discord
    conditions:
      # behind Caddy basic auth, no credentials configured here, so an
      # unauthenticated request gets 401 — that still proves Caddy (and
      # therefore the tunnel/backend) is up and responding correctly.
      - "[STATUS] == 401"
    ui:
      hide-hostname: true
      hide-url: true

metrics: true

storage:
  type: sqlite
  path: /config/sqlite.db
  caching: true

web:
  port: ${WEB_PORT}
