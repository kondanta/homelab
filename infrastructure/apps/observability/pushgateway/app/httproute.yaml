---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pushgateway
spec:
  parentRefs:
    - name: internal
      namespace: network
  hostnames:
    - "pushgateway.taylan.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pushgateway
          port: 9091
