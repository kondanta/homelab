---
# Grants vm-kube-state-metrics list/watch on VolumeSnapshots so KSM can expose
# kube_volumesnapshot_* metrics. The vm-k8s-stack chart does not extend RBAC
# for CRD API groups, so this must be managed separately.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vm-kube-state-metrics-volumesnapshots
rules:
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vm-kube-state-metrics-volumesnapshots
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vm-kube-state-metrics-volumesnapshots
subjects:
  - kind: ServiceAccount
    name: vm-kube-state-metrics
    namespace: observability
