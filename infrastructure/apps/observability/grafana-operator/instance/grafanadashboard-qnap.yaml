---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: qnap-nas
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
  json: |
    {
      "title": "QNAP NAS",
      "uid": "qnap-nas-snmp",
      "tags": ["qnap", "nas", "snmp"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 3,
      "refresh": "1m",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "row", "title": "QNAP Overview",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 1}, "collapsed": false
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Total RAM",
          "gridPos": {"x": 0, "y": 1, "w": 4, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "decbytes",
              "thresholds": {"mode": "absolute", "steps": [{"color": "purple", "value": null}]}
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "qnap_memory_total_bytes", "legendFormat": "Total RAM"}]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "CPU Cores",
          "gridPos": {"x": 4, "y": 1, "w": 4, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {"mode": "absolute", "steps": [{"color": "purple", "value": null}]}
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "count(node_cpu_seconds_total{mode=\"idle\", instance=\"qnap-nas\"})", "legendFormat": "CPU Cores"}]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Number of Disks",
          "gridPos": {"x": 8, "y": 1, "w": 4, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {"mode": "absolute", "steps": [{"color": "purple", "value": null}]}
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "count(qnap_disk_status)", "legendFormat": "Disks"}]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Number of Volumes",
          "gridPos": {"x": 12, "y": 1, "w": 4, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {"mode": "absolute", "steps": [{"color": "purple", "value": null}]}
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "count(qnap_volume_capacity_bytes)", "legendFormat": "Volumes"}]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Uptime",
          "gridPos": {"x": 16, "y": 1, "w": 8, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {"mode": "absolute", "steps": [{"color": "purple", "value": null}]}
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "qnap_uptime_centiseconds / 100", "legendFormat": "Uptime"}]
        },
        {
          "id": 7, "type": "row", "title": "Fans & Temperatures",
          "gridPos": {"x": 0, "y": 6, "w": 24, "h": 1}, "collapsed": false
        },
        {
          "id": 8,
          "type": "stat",
          "title": "FAN Speed",
          "gridPos": {"x": 0, "y": 7, "w": 8, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "horizontal", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "rotrpm",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "blue", "value": 200}
                ]
              }
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "qnap_fan_speed_rpm", "legendFormat": "{{fanDescr}}"}]
        },
        {
          "id": 9,
          "type": "stat",
          "title": "System Temperatures",
          "gridPos": {"x": 8, "y": 7, "w": 4, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "horizontal", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 50},
                  {"color": "orange", "value": 65},
                  {"color": "red", "value": 80}
                ]
              }
            }
          },
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "qnap_cpu_temperature_celsius", "legendFormat": "CPU Temperature"},
            {"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "qnap_system_temperature_celsius", "legendFormat": "System Temperature"}
          ]
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Disk Temperatures",
          "gridPos": {"x": 12, "y": 7, "w": 12, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "horizontal", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 40},
                  {"color": "orange", "value": 50},
                  {"color": "red", "value": 60}
                ]
              }
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "qnap_disk_temperature_celsius", "legendFormat": "{{diskDescr}}"}]
        },
        {
          "id": 11, "type": "row", "title": "CPU & Memory",
          "gridPos": {"x": 0, "y": 12, "w": 24, "h": 1}, "collapsed": false
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "CPU Usage",
          "gridPos": {"x": 0, "y": 13, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max", "mean"]}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 1, "fillOpacity": 15}
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "qnap_cpu_usage_percent", "legendFormat": "CPU"}]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "RAM Usage",
          "gridPos": {"x": 12, "y": 13, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max", "mean"]}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "color": {"mode": "fixed", "fixedColor": "green"},
              "custom": {"lineWidth": 1, "fillOpacity": 15}
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "(1 - qnap_memory_free_bytes / qnap_memory_total_bytes) * 100", "legendFormat": "RAM"}]
        },
        {
          "id": 21,
          "type": "stat",
          "title": "Load Average",
          "gridPos": {"x": 0, "y": 21, "w": 8, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "horizontal", "colorMode": "background",
            "graphMode": "area", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.7},
                  {"color": "orange", "value": 0.9},
                  {"color": "red", "value": 1.0}
                ]
              }
            }
          },
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "node_load1{instance=\"qnap-nas\"} / node_cpu_count{instance=\"qnap-nas\"}", "legendFormat": "1m"},
            {"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "node_load5{instance=\"qnap-nas\"} / node_cpu_count{instance=\"qnap-nas\"}", "legendFormat": "5m"},
            {"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "node_load15{instance=\"qnap-nas\"} / node_cpu_count{instance=\"qnap-nas\"}", "legendFormat": "15m"}
          ]
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "CPU Usage by Mode",
          "gridPos": {"x": 8, "y": 21, "w": 16, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max", "mean"]}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 1, "fillOpacity": 10}
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "rate(node_cpu_seconds_total{instance=\"qnap-nas\", mode!=\"idle\"}[$__rate_interval]) / node_cpu_count{instance=\"qnap-nas\"}", "legendFormat": "{{mode}}"}]
        },
        {
          "id": 26,
          "type": "stat",
          "title": "Swap Usage",
          "gridPos": {"x": 0, "y": 26, "w": 8, "h": 3},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "horizontal", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.5},
                  {"color": "orange", "value": 0.7},
                  {"color": "red", "value": 0.85}
                ]
              }
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "1 - node_memory_SwapFree_bytes{instance=\"qnap-nas\"} / node_memory_SwapTotal_bytes{instance=\"qnap-nas\"}", "legendFormat": "Swap"}]
        },
        {
          "id": 14, "type": "row", "title": "Network",
          "gridPos": {"x": 0, "y": 29, "w": 24, "h": 1}, "collapsed": false
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Network Usage",
          "gridPos": {"x": 0, "y": 30, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max", "mean"]}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 1, "fillOpacity": 10}
            },
            "overrides": [
              {
                "matcher": {"id": "byRegexp", "options": "rx.*"},
                "properties": [{"id": "custom.transform", "value": "negative-Y"}]
              }
            ]
          },
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "rate(qnap_if_tx_bytes_total[5m])", "legendFormat": "tx {{ifDescr}}"},
            {"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "rate(qnap_if_rx_bytes_total[5m])", "legendFormat": "rx {{ifDescr}}"}
          ]
        },
        {
          "id": 16, "type": "row", "title": "Storage",
          "gridPos": {"x": 0, "y": 38, "w": 24, "h": 1}, "collapsed": false
        },
        {
          "id": 17,
          "type": "bargauge",
          "title": "Volume Usage",
          "gridPos": {"x": 0, "y": 39, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "horizontal",
            "displayMode": "gradient",
            "valueMode": "color",
            "showUnfilled": true,
            "text": {"titleSize": 14, "valueSize": 24}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.70},
                  {"color": "orange", "value": 0.85},
                  {"color": "red", "value": 0.95}
                ]
              }
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "1 - (qnap_volume_free_bytes / qnap_volume_capacity_bytes)", "legendFormat": "{{volumeName}}"}]
        },
        {
          "id": 18, "type": "row", "title": "Disk Health (SMART)",
          "gridPos": {"x": 0, "y": 47, "w": 24, "h": 1}, "collapsed": false
        },
        {
          "id": 19,
          "type": "stat",
          "title": "Disk Health",
          "gridPos": {"x": 0, "y": 48, "w": 24, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "horizontal", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 40},
                  {"color": "orange", "value": 50},
                  {"color": "red", "value": 60}
                ]
              }
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "node_hdtmp_C{instance=\"qnap-nas\"}", "legendFormat": "HD{{hd}} ({{smart}})"}]
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Disk Temperature History",
          "gridPos": {"x": 0, "y": 53, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max", "mean"]}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 1, "fillOpacity": 15}
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "node_hdtmp_C{instance=\"qnap-nas\"}", "legendFormat": "HD{{hd}} ({{smart}})"}]
        },
        {
          "id": 23, "type": "row", "title": "Disk I/O",
          "gridPos": {"x": 0, "y": 61, "w": 24, "h": 1}, "collapsed": false
        },
        {
          "id": 24,
          "type": "timeseries",
          "title": "Disk Throughput",
          "gridPos": {"x": 0, "y": 62, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max", "mean"]}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 1, "fillOpacity": 10}
            }
          },
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "rate(node_disk_read_bytes_total{instance=\"qnap-nas\"}[$__rate_interval])", "legendFormat": "{{device}} read"},
            {"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "rate(node_disk_written_bytes_total{instance=\"qnap-nas\"}[$__rate_interval])", "legendFormat": "{{device}} write"}
          ]
        },
        {
          "id": 25,
          "type": "timeseries",
          "title": "Disk IOPS",
          "gridPos": {"x": 12, "y": 62, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["last", "max", "mean"]}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "iops",
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 1, "fillOpacity": 10}
            }
          },
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "rate(node_disk_read_ops_total{instance=\"qnap-nas\"}[$__rate_interval])", "legendFormat": "{{device}} read"},
            {"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "rate(node_disk_write_ops_total{instance=\"qnap-nas\"}[$__rate_interval])", "legendFormat": "{{device}} write"}
          ]
        }
        ,
        {
          "id": 27, "type": "row", "title": "RAID Arrays",
          "gridPos": {"x": 0, "y": 70, "w": 24, "h": 1}, "collapsed": false
        },
        {
          "id": 28,
          "type": "stat",
          "title": "Array Status",
          "gridPos": {"x": 0, "y": 71, "w": 12, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "horizontal", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {"type": "value", "options": {"0": {"text": "INACTIVE", "color": "red"}, "1": {"text": "Active", "color": "green"}}}
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "node_md_state{instance=\"qnap-nas\", state=\"active\"}", "legendFormat": "{{device}}"}]
        },
        {
          "id": 29,
          "type": "stat",
          "title": "Failed Disks",
          "gridPos": {"x": 12, "y": 71, "w": 12, "h": 5},
          "datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "horizontal", "colorMode": "background",
            "graphMode": "none", "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            }
          },
          "targets": [{"datasource": {"type": "prometheus", "uid": "$${DS_PROMETHEUS}"}, "expr": "node_md_disks{instance=\"qnap-nas\", state=\"failed\"}", "legendFormat": "{{device}}"}]
        }
      ]
    }
