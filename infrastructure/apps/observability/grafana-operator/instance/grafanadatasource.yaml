---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriametrics
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://vmsingle-stack.observability.svc.cluster.local:8428/prometheus
    isDefault: true
    jsonData:
      timeInterval: 1m
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: Loki
    type: loki
    access: proxy
    url: http://loki.observability.svc.cluster.local:3100
    jsonData:
      # $$ is Flux's escape for a literal $ (this Kustomization has postBuild.substitute).
      # datasourceUid values below are the uids the operator assigned (each CR's metadata.uid;
      # spec.uid is immutable on existing CRs so it cannot be pinned). If a datasource CR is
      # ever deleted and recreated, update them:
      #   kubectl -n observability get grafanadatasource -o custom-columns=N:.metadata.name,UID:.metadata.uid
      derivedFields:
        # Envoy access log trace_id -> open that trace in Tempo. Empty for untraced requests.
        - name: TraceID
          matcherType: regex
          matcherRegex: "\"trace_id\":\"([0-9a-f]+)\""
          url: "$${__value.raw}"
          datasourceUid: b5c2d5da-277f-454f-92a8-16e334aa6d2b
          urlDisplayLabel: Open trace
        # x-request-id -> find the gateway trace by the span's guid:x-request-id attribute.
        # Works for any log that carries the id (e.g. an app logging the forwarded header).
        # Only sampled traces exist in Tempo: all errors and >2s, ~25% of the rest.
        - name: RequestID
          matcherType: regex
          matcherRegex: "\"x-request-id\":\"([0-9a-f-]{36})\""
          url: "https://grafana.taylan.dev/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22b5c2d5da-277f-454f-92a8-16e334aa6d2b%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22tempo%22%2C%22uid%22%3A%22b5c2d5da-277f-454f-92a8-16e334aa6d2b%22%7D%2C%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7B%20span.%5C%22guid%3Ax-request-id%5C%22%20%3D%20%5C%22$${__value.raw}%5C%22%20%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-7d%22%2C%22to%22%3A%22now%22%7D%7D%7D"
          urlDisplayLabel: Find trace by request ID
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: Tempo
    type: tempo
    access: proxy
    url: http://tempo.observability.svc.cluster.local:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: c7391b60-7c1d-4701-8ca2-787ad47ba8ac
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: "{namespace=\"network\", container=\"envoy\"} |= \"$${__trace.traceId}\""
      tracesToMetrics:
        datasourceUid: 200ff6f7-e43e-458a-8051-5f42e60a8b78
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        # the span's upstream_cluster attribute is the HTTPRoute name, same string as envoy_cluster_name
        tags:
          - key: upstream_cluster
            value: envoy_cluster_name
        queries:
          - name: Request rate
            query: "sum(rate(envoy_cluster_upstream_rq_total{$$__tags}[1m]))"
          - name: Error rate (5xx)
            query: "sum(rate(envoy_cluster_upstream_rq_xx{$$__tags, envoy_response_code_class=\"5\"}[1m]))"
          - name: p95 upstream latency (ms)
            query: "histogram_quantile(0.95, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{$$__tags}[1m])))"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: AlertManager
    type: alertmanager
    access: proxy
    url: http://vmalertmanager-stack.observability.svc.cluster.local:9093
    jsonData:
      implementation: prometheus
