---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app snmp-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: snmp-exporter
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    config: |
      auths:
        qnap_v2:
          community: public
          version: 2
      modules:
        qnap:
          walk:
            - 1.3.6.1.4.1.24681.1.3.1   # systemCPU-UsageEX
            - 1.3.6.1.4.1.24681.1.3.2   # systemTotalMemEX
            - 1.3.6.1.4.1.24681.1.3.3   # systemFreeMemEX
            - 1.3.6.1.4.1.24681.1.3.4   # systemUptimeEX
            - 1.3.6.1.4.1.24681.1.3.5   # cpu-TemperatureEX
            - 1.3.6.1.4.1.24681.1.3.6   # systemTemperatureEX
            - 1.3.6.1.4.1.24681.1.3.9   # systemIfTableEx
            - 1.3.6.1.4.1.24681.1.3.11  # systemHdTableEX
            - 1.3.6.1.4.1.55062.1.10.9  # volumeTable (QTS-MIB)
            - 1.3.6.1.4.1.55062.1.12.9  # systemFanTable (QTS-MIB)
            - 1.3.6.1.2.1.2.2          # IF-MIB ifTable (byte counters)
          metrics:
            - name: qnap_cpu_usage_percent
              oid: 1.3.6.1.4.1.24681.1.3.1
              type: gauge
              help: System CPU usage percent
            - name: qnap_memory_total_bytes
              oid: 1.3.6.1.4.1.24681.1.3.2
              type: gauge
              help: System total memory in bytes
            - name: qnap_memory_free_bytes
              oid: 1.3.6.1.4.1.24681.1.3.3
              type: gauge
              help: System free memory in bytes
            - name: qnap_uptime_centiseconds
              oid: 1.3.6.1.4.1.24681.1.3.4
              type: gauge
              help: System uptime in hundredths of seconds (divide by 100 for seconds)
            - name: qnap_cpu_temperature_celsius
              oid: 1.3.6.1.4.1.24681.1.3.5
              type: gauge
              help: CPU temperature in Celsius
            - name: qnap_system_temperature_celsius
              oid: 1.3.6.1.4.1.24681.1.3.6
              type: gauge
              help: System temperature in Celsius
            - name: qnap_if_packets_received_total
              oid: 1.3.6.1.4.1.24681.1.3.9.1.3
              type: counter
              help: Network packets received per interface
              indexes:
                - labelname: ifIndex
                  type: Integer32
              lookups:
                - labels: [ifIndex]
                  labelname: ifDescr
                  oid: 1.3.6.1.4.1.24681.1.3.9.1.2
                  type: DisplayString
            - name: qnap_if_packets_sent_total
              oid: 1.3.6.1.4.1.24681.1.3.9.1.4
              type: counter
              help: Network packets sent per interface
              indexes:
                - labelname: ifIndex
                  type: Integer32
              lookups:
                - labels: [ifIndex]
                  labelname: ifDescr
                  oid: 1.3.6.1.4.1.24681.1.3.9.1.2
                  type: DisplayString
            - name: qnap_if_error_packets_total
              oid: 1.3.6.1.4.1.24681.1.3.9.1.5
              type: counter
              help: Network error packets per interface
              indexes:
                - labelname: ifIndex
                  type: Integer32
              lookups:
                - labels: [ifIndex]
                  labelname: ifDescr
                  oid: 1.3.6.1.4.1.24681.1.3.9.1.2
                  type: DisplayString
            - name: qnap_disk_temperature_celsius
              oid: 1.3.6.1.4.1.24681.1.3.11.1.3
              type: gauge
              help: Disk temperature in Celsius
              indexes:
                - labelname: diskIndex
                  type: Integer32
              lookups:
                - labels: [diskIndex]
                  labelname: diskDescr
                  oid: 1.3.6.1.4.1.24681.1.3.11.1.2
                  type: DisplayString
            - name: qnap_disk_status
              oid: 1.3.6.1.4.1.24681.1.3.11.1.4
              type: gauge
              help: "Disk status: 0=ready, -4=unknown, -5=noDisk, -6=invalid, -9=rwError"
              indexes:
                - labelname: diskIndex
                  type: Integer32
              lookups:
                - labels: [diskIndex]
                  labelname: diskDescr
                  oid: 1.3.6.1.4.1.24681.1.3.11.1.2
                  type: DisplayString
            - name: qnap_volume_capacity_bytes
              oid: 1.3.6.1.4.1.55062.1.10.9.1.3
              type: gauge
              help: Volume total capacity in bytes
              indexes:
                - labelname: volumeIndex
                  type: Integer32
              lookups:
                - labels: [volumeIndex]
                  labelname: volumeName
                  oid: 1.3.6.1.4.1.55062.1.10.9.1.8
                  type: DisplayString
            - name: qnap_volume_free_bytes
              oid: 1.3.6.1.4.1.55062.1.10.9.1.4
              type: gauge
              help: Volume free size in bytes
              indexes:
                - labelname: volumeIndex
                  type: Integer32
              lookups:
                - labels: [volumeIndex]
                  labelname: volumeName
                  oid: 1.3.6.1.4.1.55062.1.10.9.1.8
                  type: DisplayString
            - name: qnap_if_rx_bytes_total
              oid: 1.3.6.1.2.1.2.2.1.10
              type: counter
              help: Network bytes received per interface (IF-MIB ifInOctets)
              indexes:
                - labelname: ifIndex
                  type: Integer32
              lookups:
                - labels: [ifIndex]
                  labelname: ifDescr
                  oid: 1.3.6.1.2.1.2.2.1.2
                  type: DisplayString
            - name: qnap_if_tx_bytes_total
              oid: 1.3.6.1.2.1.2.2.1.16
              type: counter
              help: Network bytes sent per interface (IF-MIB ifOutOctets)
              indexes:
                - labelname: ifIndex
                  type: Integer32
              lookups:
                - labels: [ifIndex]
                  labelname: ifDescr
                  oid: 1.3.6.1.2.1.2.2.1.2
                  type: DisplayString
            - name: qnap_fan_speed_rpm
              oid: 1.3.6.1.4.1.55062.1.12.9.1.3
              type: gauge
              help: System fan speed in RPM
              indexes:
                - labelname: fanIndex
                  type: Integer32
              lookups:
                - labels: [fanIndex]
                  labelname: fanDescr
                  oid: 1.3.6.1.4.1.55062.1.12.9.1.2
                  type: DisplayString
    serviceMonitor:
      enabled: true
      params:
        - name: qnap
          module: [qnap]
          target: 10.1.20.100
          auth: [qnap_v2]
      path: /snmp
      scrapeTimeout: 30s
      relabelings:
        - sourceLabels: [__param_target]
          targetLabel: instance
    configmapReload:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
