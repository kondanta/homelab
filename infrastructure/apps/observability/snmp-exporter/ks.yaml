---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snmp-exporter
  namespace: flux-system
spec:
  dependsOn:
    - name: victoria-metrics
      namespace: flux-system
  interval: 1h
  path: ./infrastructure/apps/observability/snmp-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  targetNamespace: observability
