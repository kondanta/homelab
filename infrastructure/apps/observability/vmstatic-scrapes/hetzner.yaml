---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: hetzner
  namespace: observability
spec:
  # Reached through the towonel private mesh (towonel-mesh app): the exporters listen on the
  # host's loopback only. If the mesh pod or tunnel is down, both targets go down together,
  # which MetalHostDown reports as the host being unreachable.
  targetEndpoints:
    - targets:
        - "towonel-mesh.observability.svc.cluster.local:9100"
      labels:
        job: node-exporter-metal
        instance: hetzner-host
      interval: 30s
      path: /metrics
    - targets:
        - "towonel-mesh.observability.svc.cluster.local:8081"
      labels:
        job: cadvisor
        instance: hetzner-host
      interval: 30s
      path: /metrics
