---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-ngx
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  maxHistory: 3
  uninstall:
    keepHistory: false
  install:
    remediation:
      retries: 1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/containers/resources/limits
        target:
          kind: Pod
  values:
    controllers:
      paperless-ngx:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 19.0.0@sha256:b49e2f1f373d932ab41614633ac89fa506e5d21bb13cc18d9c96ca026e51f502
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
            env:
              TZ: Europe/Oslo
              PAPERLESS_URL: https://paperless.taylan.dev
              PAPERLESS_PORT: &port 8000
              PAPERLESS_TIME_ZONE: Europe/Oslo
              PAPERLESS_DBENGINE: postgresql
              # Trailing dot = absolute name: skips the ndots:5 search list, which would
              # otherwise leak <name>.infra.local (NXDOMAIN) to AdGuard on every lookup.
              PAPERLESS_DBHOST: postgres.network.svc.cluster.local.
              PAPERLESS_DBPORT: "5432"
              PAPERLESS_DBNAME: paperless
              PAPERLESS_REDIS: redis://redis.network.svc.cluster.local:6379
              PAPERLESS_OCR_LANGUAGE: eng
              PAPERLESS_TIKA_ENABLED: "1"
              PAPERLESS_TIKA_ENDPOINT: http://localhost:9998
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
              PAPERLESS_THREADS_PER_WORKER: "1"
              PAPERLESS_WEBSERVER_WORKERS: "1"
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /accounts/login/
                    port: *port
                    # 3.5.0 rejects the pod-IP Host header (DisallowedHost -> 400)
                    httpHeaders:
                      - name: Host
                        value: paperless.taylan.dev
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /accounts/login/
                    port: *port
                    # 3.5.0 rejects the pod-IP Host header (DisallowedHost -> 400)
                    httpHeaders:
                      - name: Host
                        value: paperless.taylan.dev
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /accounts/login/
                    port: *port
                    # 3.5.0 rejects the pod-IP Host header (DisallowedHost -> 400)
                    httpHeaders:
                      - name: Host
                        value: paperless.taylan.dev
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512M
              limits:
                memory: 2Gi
            securityContext:
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETUID", "SETGID"]
          tika:
            image:
              repository: apache/tika
              tag: 3.4.0.0@sha256:9f3e5bb9da4229a971a4839416b3204499f20668ee834fa741a6a7504bbea7bf
            resources:
              limits:
                memory: 220Mi
              requests:
                cpu: 10m
                memory: 220Mi
          gotenberg:
            env:
              DISABLE_GOOGLE_CHROME: "1"
            image:
              repository: gotenberg/gotenberg
              tag: 8.40.0@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
            resources:
              requests:
                cpu: 10m
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /api/
            conditions:
              - "[STATUS] < 400"
        hostnames:
          - paperless.taylan.dev
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
          - name: external
            namespace: network
            sectionName: https

    persistence:
      media:
        existingClaim: paperless-ngx
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/media
      data:
        existingClaim: paperless-ngx-data
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/data
      consume:
        type: emptyDir
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/consume
      export:
        type: emptyDir
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/export
