---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app koito
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      koito:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: gabehf/koito
              # renovate: datasource=docker depName=gabehf/koito
              tag: v0.3.2@sha256:3011de405ba2a5c56270928c2b0391add8aa3b3ed68363531b3c64b61f238857
            env:
              TZ: Europe/Oslo
              # soft heap cap (~80% of the limit): GC works harder near it instead of growing into an OOMKill
              GOMEMLIMIT: 200MiB
              # libvips (bimg, cgo) memory is outside the Go heap; glibc per-thread arenas fragment and are rarely returned to the OS
              MALLOC_ARENA_MAX: "2"
              MALLOC_TRIM_THRESHOLD_: "131072"
              VIPS_CONCURRENCY: "1"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: 4110
    route:
      app:
        # monitored by the hand-written external endpoint in gatus config.yaml
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - koito.taylan.dev
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /etc/koito
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
