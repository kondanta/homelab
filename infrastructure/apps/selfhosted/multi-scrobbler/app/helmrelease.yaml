---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app multi-scrobbler
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      multi-scrobbler:
        # 0 until ms.db + Spotify creds are seeded into the PVC; a follow-up PR flips this to 1
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: foxxmd/multi-scrobbler
              # renovate: datasource=docker depName=foxxmd/multi-scrobbler
              tag: 0.20.0@sha256:2a11137663437b5d7c2e24f4d1bfc3ef72ccbeca9e1377e28c72928789236aab
            env:
              # Image boots through s6-overlay (/init) as root and drops to PUID/PGID
              # itself, so no runAsNonRoot / readOnlyRootFilesystem here.
              PUID: "1000"
              PGID: "1000"
              TZ: Europe/Oslo
              BASE_URL: https://scrobbler.taylan.dev
              SPOTIFY_ID: KoitoFeeder # must match currentCreds-<ID>.json in /config
              SPOTIFY_ENABLE: "true"
              SPOTIFY_REDIRECT_URI: https://scrobbler.taylan.dev/callback
              KOITO_ID: SpotifyHistory
              KOITO_ENABLE: "true"
              KOITO_URL: http://koito:4110 # in-cluster Service, same namespace
              LZ_ID: TestLZ
              LZ_ENABLE: "true"
            envFrom:
              - secretRef:
                  name: multi-scrobbler-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 9078
    route:
      app:
        hostnames:
          - scrobbler.taylan.dev
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
