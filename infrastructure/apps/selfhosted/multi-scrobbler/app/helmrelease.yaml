---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app multi-scrobbler
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      multi-scrobbler:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: foxxmd/multi-scrobbler
              # renovate: datasource=docker depName=foxxmd/multi-scrobbler
              tag: 0.21.0@sha256:d3dacd94c5e6629d9a01579c2e4484de9440c1755dcbaae2ffb50d19b18793a0
            env:
              TZ: Europe/Oslo
              BASE_URL: https://scrobbler.taylan.dev
              SPOTIFY_ID: KoitoFeeder # must match currentCreds-<ID>.json in /config
              SPOTIFY_ENABLE: "true"
              SPOTIFY_REDIRECT_URI: https://scrobbler.taylan.dev/callback
              KOITO_ID: SpotifyHistory
              KOITO_ENABLE: "true"
              KOITO_URL: http://koito:4110 # in-cluster Service, same namespace
              LZ_ID: TestLZ
              LZ_ENABLE: "true"
            envFrom:
              - secretRef:
                  name: multi-scrobbler-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    # 0.21.0+ is a distroless image with no PUID/PGID support: it runs as whatever
    # user the pod sets (default 65532). /config is owned by 1000:1000 from the
    # old image, so run as that user.
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: 9078
    route:
      app:
        hostnames:
          - scrobbler.taylan.dev
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
