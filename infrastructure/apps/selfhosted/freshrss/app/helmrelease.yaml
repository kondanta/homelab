---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freshrss
spec:
  chartRef:
    kind: OCIRepository
    name: freshrss
  interval: 1h
  values:
    controllers:
      freshrss:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: freshrss/freshrss
              tag: 1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
            env:
              CRON_MIN: "*"
              DOMAIN: freshrss.taylan.dev
              LISTEN: &port 8080
              # OIDC (Debian image, mod_auth_openidc). Only the web UI (/i/) is protected; the API has
              # its own auth. FreshRSS must run with auth_type http_auth, and the claim below must equal
              # the FreshRSS username. Client id/secret/crypto key come from the secret below.
              OIDC_ENABLED: "1"
              OIDC_PROVIDER_METADATA_URL: https://auth.taylan.dev/application/o/freshrss/.well-known/openid-configuration
              OIDC_REMOTE_USER_CLAIM: preferred_username
              OIDC_SCOPES: openid profile
              # TLS ends at the gateway; without this the redirect URI would be built as http://
              OIDC_X_FORWARDED_HEADERS: X-Forwarded-Host X-Forwarded-Proto
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.taylan.dev"
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          freshrss:
            app:
              - path: /var/www/FreshRSS/data
                subPath: data
                readOnly: false
              - path: /var/www/FreshRSS/extensions
                subPath: extensions
                readOnly: false
