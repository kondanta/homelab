---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app seerr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/login-ratelimit
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  interval: 1h
  path: ./infrastructure/apps/media-center/seerr/app
  postBuild:
    substitute:
      APP: seerr
      # seerr proxies these credentials to Jellyfin/LDAP, so it is a second brute-force door
      RL_LOGIN_PATH: '/api/v1/auth/(jellyfin|local)([?].*)?'
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media-center
  wait: false
