---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name shoko
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  values:
    controllers:
      shoko:
        type: statefulset # SQLite DB
        containers:
          app:
            image:
              repository: ghcr.io/shokoanime/server
              tag: v6.0.0@sha256:7d51889dd7f70dc5deeeab58c3deb6d498ab5b9b8dbec9bbe661c49d06e98c9b
            command:
              - /bin/bash
              - /dockerentry.sh
            env:
              PUID: "1001" #media-user
              PGID: "1000"
              TZ: Europe/Oslo
            securityContext:
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 300m
                memory: 650Mi
              limits:
                cpu: 900m
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 8111
    route:
      app:
        hostnames:
          - shoko.taylan.dev
        parentRefs:
          - name: internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/shoko/.shoko
      metadata:
        accessMode: ReadWriteOnce
        size: 20Gi
        suffix: metadata
        globalMounts:
          - path: /home/shoko/.shoko/Shoko.CLI/images
      media:
        existingClaim: "nfs-media-pvc"
        globalMounts:
          - path: /data
