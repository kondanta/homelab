---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyfin
spec:
  components:
    - ../../../../components/volsync
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  interval: 1h
  path: ./infrastructure/apps/media-center/jellyfin/app
  postBuild:
    substitute:
      APP: jellyfin
      VOLSYNC_CAPACITY: 20Gi # must be >= the jellyfin PVC
      VOLSYNC_PGID: "1000" # jellyfin runs as 1001:1000
      VOLSYNC_PUID: "1001"
      VOLSYNC_SCHEDULE: "0 5 * * 0" # weekly (Sun 05:00); restores are rare, see kopia policy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media-center
  wait: false
