---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 15m
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  # The chart hardcodes hostPath: /var/lib/longhorn/ on longhorn-manager with
  # no values.yaml key to add another mount (verified against
  # chart/templates/daemonset-sa.yaml — no extraVolumes/extraHostPath support
  # in 1.12.1). Mounting /var/mnt/ broadly so it also covers local-hostpath
  # and future UserVolumeConfig volumes without repeated patches.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: longhorn-manager
            patch: |
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: var-mnt
                  hostPath:
                    path: /var/mnt/
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: var-mnt
                  mountPath: /var/mnt/
                  mountPropagation: Bidirectional
  values:
    persistence:
      defaultClass: true
      reclaimPolicy: Delete
      recurringJobSelector:
        enable: true
        jobList: '[{"name":"trim","isGroup":true}]'
    ingress:
      enabled: false
    defaultSettings:
      autoCleanupSystemGeneratedSnapshot: true
      autoCleanupRecurringJobBackupSnapshot: true
      concurrentAutomaticEngineUpgradePerNodeLimit: "1"
      autoCleanupSnapshotWhenDeleteBackup: true
      autoCleanupSnapshotAfterOnDemandBackupCompleted: true
      rwxVolumeFastFailover: true
    longhornManager:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
    longhornDriver:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    longhornUI:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
