---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_clienttrafficpolicies.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: internal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  tls:
    minVersion: '1.2'
    alpnProtocols:
      - h2
      - http/1.1
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_clienttrafficpolicies.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
  proxyProtocol:
    optional: true
  # No clientIPDetection on purpose: the real client IP arrives via PROXY protocol (Caddy -> towonel
  # -> agent) and no HTTP proxy sits in front of Envoy. Any xForwardedFor block (even numTrustedHops: 0)
  # makes Envoy take the client address from a client-supplied X-Forwarded-For, which lets anyone
  # pick the address that rate limits and policies key on.
  tls:
    minVersion: '1.2'
    alpnProtocols:
      - h2
      - http/1.1
