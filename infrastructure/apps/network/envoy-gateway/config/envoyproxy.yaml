---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_envoyproxies.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: config
spec:
  # ipFamily: DualStack
  telemetry:
    metrics:
      prometheus: {}
    tracing:
      # Spans go to the OTel collector (tail sampling, then Tempo). The collector is a
      # plain Service in this namespace, so no ReferenceGrant or Backend CRD is needed.
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: otel-collector
            port: 4317
      # Envoy samples everything; the collector's tail sampler decides what to keep.
      samplingRate: 100
  shutdown:
    drainTimeout: 300s
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 25m
              memory: 640Mi
            limits:
              cpu: 500m
              memory: 1Gi
      envoyService:
        externalTrafficPolicy: Cluster # cilium l2 announce doesn't support externalTrafficPolicy: Local
