---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-cloudflare
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-dns-cloudflare
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    provider:
      name: cloudflare
    env:
      - name: &name CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret cloudflare-dns-secret
            key: *name
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-name=external
      - --exclude-target-net=10.0.0.0/8
      - --exclude-target-net=172.16.0.0/12
      - --exclude-target-net=192.168.0.0/16
      # gateway-httproute source publishes the "external" Gateway's private LB IP
      # (10.1.20.202) as the target, which the exclude-target-net filters above
      # then drop, silently zeroing every record. --default-targets alone is a
      # no-op here: newer external-dns only applies it when the source provides
      # zero targets, and gateway-httproute always provides the private IP.
      # --force-default-targets restores the old "always override" behavior.
      - --default-targets=external.taylan.dev
      - --force-default-targets
      # force-default-targets applies to every endpoint this instance manages,
      # including external.taylan.dev itself (from the crd source's towonel/
      # cloudflare-tunnel DNSEndpoints), which would otherwise become a CNAME
      # pointing at itself and fail the whole zone's batch apply.
      - --regex-domain-exclude=^external\.taylan\.dev$
    triggerLoopOnEvent: true
    policy: sync
    sources: ["crd", "gateway-httproute"]
    txtOwnerId: default
    txtPrefix: k8s.
    domainFilters:
      - taylan.dev
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 96Mi
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
