---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-cloudflare
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-dns-cloudflare
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    provider:
      name: cloudflare
    env:
      - name: &name CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret cloudflare-dns-secret
            key: *name
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-name=external
      - --exclude-target-net=10.0.0.0/8
      - --exclude-target-net=172.16.0.0/12
      - --exclude-target-net=192.168.0.0/16
      # gateway-httproute previously published the "external" Gateway's private
      # LB IP (10.1.20.202) as the target, which exclude-target-net above then
      # dropped, silently zeroing every record. Root cause: the Gateway's
      # target: external.taylan.dev annotation used the deprecated
      # external-dns.alpha.kubernetes.io/ prefix, which this version ignores
      # (default is external-dns.kubernetes.io/, no "alpha") — now fixed in
      # gateway.yaml, so the annotation itself correctly overrides the target
      # and --default-targets/--force-default-targets are no longer needed.
      #
      # Still excluding these two names as defense-in-depth: external.taylan.dev
      # is also crd-sourced (towonel/cloudflare-tunnel DNSEndpoints) and could
      # self-reference again under any future target-forcing config; https-redirect
      # has no hostnames so it inherits the wildcard listener hostname
      # (*.taylan.dev) regardless of whether its controller: none annotation
      # is honored.
      - --regex-domain-exclusion=^(external|\*)\.taylan\.dev$
    triggerLoopOnEvent: true
    policy: sync
    sources: ["crd", "gateway-httproute"]
    txtOwnerId: default
    txtPrefix: k8s.
    domainFilters:
      - taylan.dev
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 96Mi
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
