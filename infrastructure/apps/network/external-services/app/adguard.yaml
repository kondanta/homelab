---
apiVersion: v1
kind: Service
metadata:
  name: adguard
  namespace: network
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: adguard
  namespace: network
  labels:
    kubernetes.io/service-name: adguard
addressType: IPv4
ports:
  - name: http
    port: 80
    protocol: TCP
endpoints:
  - addresses:
      - "10.1.20.52"
