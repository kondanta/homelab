---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: network
spec:
  ports:
    - name: redis
      port: 6379
      protocol: TCP
      targetPort: 6379
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: redis
  namespace: network
  labels:
    kubernetes.io/service-name: redis
addressType: IPv4
ports:
  - name: redis
    port: 6379
    protocol: TCP
endpoints:
  - addresses:
      - "10.1.20.51"
