---
services:
  towonel:
    # renovate: datasource=docker depName=codeberg.org/towonel/towonel-node versioning=semver-coerced
    image: codeberg.org/towonel/towonel-node:1.5.1
    container_name: towonel
    restart: unless-stopped
    ports:
      - "8443:8443/tcp"
      - "51820:51820/udp"
    env_file:
      - .env
    volumes:
      - towonel_data:/data
    networks:
      - proxy
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--max-time"
        - "2"
        - "-fsS"
        - "http://localhost:8443/v1/health"
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

networks:
  proxy:
    external: true

volumes:
  towonel_data:
    driver: local
    driver_opts:
      type: none
      device: /root/projects/towonel/data
      o: bind
