# https://mise.jdx.dev/getting-started.html for docs :) 
[env]
SOPS_AGE_KEY_FILE = "{{config_root}}/age.agekey"
TALOSCONFIG = "{{config_root}}/provision/talos/talosconfig"
KUBECONFIG = "{{config_root}}/provision/talos/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
JUST_UNSTABLE = "1"
LEFTHOOK_OUTPUT = "false"

[tools]
"aqua:casey/just" = "1.58.0"
"aqua:cilium/cilium-cli" = "0.20.1"
"aqua:cli/cli" = "2.101.0"
"aqua:cloudflare/cloudflared" = "2026.9.3"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:evilmartians/lefthook" = "2.1.14"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:getsops/sops" = "3.13.3"
"aqua:google/go-containerregistry" = "0.22.1"
"aqua:helm/helm" = "4.3.0"
"aqua:helmfile/helmfile" = "1.8.0"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.1"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:siderolabs/talos" = "1.14.1"
"aqua:yannh/kubeconform" = "0.8.0"
"pipx:flux-local" = "latest"
"aqua:mitsuhiko/minijinja" = "2.24.0"
"aqua:charmbracelet/gum" = "2.0.2"
