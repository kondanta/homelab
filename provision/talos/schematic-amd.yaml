customization:
    extraKernelArgs:
        - talos.platform=metal
        - init_on_alloc=1
        - init_on_free=1
        - pti=on
        - slab_nomerge
        - talos.shutdown=poweroff
    systemExtensions:
        officialExtensions:
            - siderolabs/amd-ucode
            - siderolabs/amdgpu
            - siderolabs/btrfs
            - siderolabs/iscsi-tools
            - siderolabs/realtek-firmware
            - siderolabs/util-linux-tools
