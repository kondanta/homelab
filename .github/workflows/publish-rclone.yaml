---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish rclone-sync

on:
  push:
    branches: [main]
    paths:
      - metal/services/rclone/Dockerfile
      - metal/services/rclone/sync.sh
      - metal/services/rclone/entrypoint.sh
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build rclone-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from Dockerfile
        id: meta
        run: |
          version=$(grep '^FROM' metal/services/rclone/Dockerfile | sed 's|FROM [^:]*:||')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: metal/services/rclone
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/kondanta/homelab/metal/rclone-sync:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
