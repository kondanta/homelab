---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish pgbackup

on:
  push:
    branches: [main]
    paths:
      - metal/services/pgbackup/Dockerfile
      - metal/services/pgbackup/backup.sh
      - metal/services/pgbackup/entrypoint.sh
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build pgbackup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from Dockerfile
        id: meta
        run: |
          version=$(grep '^FROM' metal/services/pgbackup/Dockerfile | sed 's|FROM [^:]*:||')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: metal/services/pgbackup
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/kondanta/homelab/metal/pgbackup:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
